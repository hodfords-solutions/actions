name: Build and Publish Library
on:
  workflow_call:
    inputs:
      build_path:
        description: 'Path to the library to build'
        required: false
        default: 'dist/libs'
        type: string
      package_path:
        description: 'Path to the package.json directory'
        required: false
        default: './'
        type: string
      package_manager:
        description: 'Package manager of the calling repository: npm or pnpm'
        required: false
        default: 'npm'
        type: string
    secrets:
      NPM_TOKEN:
        required: true
jobs:
  check-package:
    runs-on: ubuntu-latest
    container: node:22
    permissions:
      packages: write
      contents: read
    outputs:
      packageExists: ${{ steps.check.outputs.packageExists }}
    env:
      PM_INSTALL: ${{ inputs.package_manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm install' }}
    steps:
      - name: Validate inputs
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm|pnpm) ;;
            *) echo "Unsupported package_manager: '$PACKAGE_MANAGER' (expected 'npm' or 'pnpm')" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: pnpm/action-setup@v4
        if: inputs.package_manager == 'pnpm'
        with:
          package_json_file: ${{ inputs.package_path }}/package.json
      - run: |
          cd ${{ inputs.package_path }}
          $PM_INSTALL
      - name: Check if package is published
        run: |
          cd ${{ inputs.package_path }}
          if [ "$(npm view $(node -p "require('./package.json').name")@$(node -p "require('./package.json').version") version)" = "$(node -p "require('./package.json').version")" ]; then
            echo "packageExists=True" >> $GITHUB_OUTPUT
          else
            echo "packageExists=False" >> $GITHUB_OUTPUT
          fi
        id: check
  build:
    needs: check-package
    container: node:22
    if: ${{ needs.check-package.outputs.packageExists == 'False' }}
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      PM_INSTALL: ${{ inputs.package_manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm install' }}
      PM_RUN: ${{ inputs.package_manager == 'pnpm' && 'pnpm run' || 'npm run' }}
      PM_PUBLISH: ${{ inputs.package_manager == 'pnpm' && 'pnpm publish --access public --no-git-checks' || 'npm publish --access public' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: inputs.package_manager == 'pnpm'
        with:
          package_json_file: ${{ inputs.package_path }}/package.json
      - run: |
          cd ${{ inputs.package_path }}
          $PM_INSTALL
      - run: |
          cd ${{ inputs.package_path }}
          $PM_RUN build
      - run: |
          cd ${{ inputs.package_path }}
          export CURRENT_PATH=$(pwd)
          IFS=';' read -ra ADDR <<< "${{ inputs.build_path }}"
          for i in "${ADDR[@]}"; do
            cd $CURRENT_PATH/$i && $PM_PUBLISH
          done
        shell: bash
